name: Agent evaluations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of cases to run; 0 runs all cases"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      MODEL_NAME: qwen3.5-plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run evaluation suite
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.limit }}" != "0" ]; then args+=(--limit "${{ inputs.limit }}"); fi
          uv run python -m evals.run_evals "${args[@]}" --output artifacts/eval-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: artifacts/eval-results.json
